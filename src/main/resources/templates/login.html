<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="split-card">
        <!-- Lado Esquerdo: Foto do Campus PUC Minas com Brasão -->
        <div class="panel-left">
            <img th:src="@{/images/puc-minas-logo.png}" alt="PUC Minas" class="puc-logo">
            <span class="campus-caption">Campus Coração Eucarístico</span>
        </div>

        <!-- Lado Direito: Formulário de Login -->
        <div class="panel-right">
            <div class="form-box">
                <h1 class="form-title">Login</h1>

                <!-- Mensagem de Erro de Autenticação -->
                <div th:if="${errorMessage}" class="alert-box alert-error">
                    <span th:text="${errorMessage}">Usuário ou senha inválidos.</span>
                </div>

                <!-- Mensagem de Sucesso (após cadastro ou redefinição de senha) -->
                <div th:if="${successMessage}" class="alert-box alert-success">
                    <span th:text="${successMessage}">Ação concluída com sucesso.</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <!-- Campo Username ou Email -->
                    <div class="input-group">
                        <input type="text" id="username" name="username" class="input-field" placeholder="Username" required autofocus>
                    </div>

                    <!-- Campo Senha -->
                    <div class="input-group">
                        <div class="password-container">
                            <input type="password" id="password" name="password" class="input-field" placeholder="Senha" required>
                            <button type="button" class="btn-toggle-eye" onclick="togglePassword('password', this)" title="Mostrar/ocultar senha">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Botão Entrar -->
                    <button type="submit" class="btn-action">Entrar</button>
                </form>

                <!-- Rodapé com Links -->
                <div class="footer-text">Ainda não tem cadastro?</div>
                <div class="footer-links">
                    <a th:href="@{/register}" class="link-cadastre">Cadastre-se</a>
                    <span class="link-divider">|</span>
                    <a th:href="@{/recoverpassword}" class="link-esqueci">Esqueceu sua senha?</a>
                </div>

                <div class="demo-hint">
                    💡 Teste rápido: usuário <code>admin</code> e senha <code>admin123</code>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
