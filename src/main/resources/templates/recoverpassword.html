<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="split-card">
        <!-- Lado Esquerdo: Foto do Campus PUC Minas com Brasão -->
        <div class="panel-left">
            <img th:src="@{/images/puc-minas-logo.png}" alt="PUC Minas" class="puc-logo">
            <span class="campus-caption">Campus Coração Eucarístico</span>
        </div>

        <!-- Lado Direito: Formulário de Recuperação de Senha -->
        <div class="panel-right">
            <div class="form-box">
                <h1 class="form-title">Recuperar Senha</h1>

                <!-- Mensagem de Erro -->
                <div th:if="${errorMessage}" class="alert-box alert-error">
                    <span th:text="${errorMessage}">Ocorreu um erro.</span>
                </div>

                <p style="font-size: 13px; color: #64748b; margin-bottom: 18px; line-height: 1.4;">
                    Digite seu email cadastrado para enviarmos uma nova senha de acesso.
                </p>

                <form th:action="@{/recoverpassword}" method="post">
                    <!-- Campo Email -->
                    <div class="input-group">
                        <input type="email" id="email" name="email" th:value="${email}" class="input-field" placeholder="Email cadastrado" required autofocus>
                    </div>

                    <!-- Botão Enviar -->
                    <button type="submit" class="btn-action">Enviar Nova Senha</button>
                </form>

                <!-- Rodapé -->
                <div class="footer-text">Lembrou sua senha?</div>
                <div class="footer-links">
                    <a th:href="@{/login}" class="link-cadastre">Voltar ao Login</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
