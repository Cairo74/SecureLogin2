<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="split-card">
        <!-- Lado Esquerdo: Foto do Campus PUC Minas com Brasão -->
        <div class="panel-left">
            <img th:src="@{/images/puc-minas-logo.png}" alt="PUC Minas" class="puc-logo">
            <span class="campus-caption">Campus Coração Eucarístico</span>
        </div>

        <!-- Lado Direito: Formulário de Cadastro -->
        <div class="panel-right">
            <div class="form-box">
                <h1 class="form-title">Cadastro</h1>

                <!-- Mensagem de Erro de Validação -->
                <div th:if="${errorMessage}" class="alert-box alert-error">
                    <span th:text="${errorMessage}">Ocorreu um erro no cadastro.</span>
                </div>

                <form th:action="@{/register}" method="post">
                    <!-- Nome Completo -->
                    <div class="input-group">
                        <input type="text" id="nome" name="nome" th:value="${nome}" class="input-field" placeholder="Nome Completo" required autofocus>
                    </div>

                    <!-- Username -->
                    <div class="input-group">
                        <input type="text" id="username" name="username" th:value="${username}" class="input-field" placeholder="Username" required>
                    </div>

                    <!-- Email -->
                    <div class="input-group">
                        <input type="email" id="email" name="email" th:value="${email}" class="input-field" placeholder="Email" required>
                    </div>

                    <!-- Senha -->
                    <div class="input-group">
                        <div class="password-container">
                            <input type="password" id="password" name="password" class="input-field" placeholder="Senha (mínimo 6 dígitos)" required>
                            <button type="button" class="btn-toggle-eye" onclick="togglePassword('password', this)" title="Mostrar/ocultar senha">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Confirmar Senha -->
                    <div class="input-group">
                        <div class="password-container">
                            <input type="password" id="confirmPassword" name="confirmPassword" class="input-field" placeholder="Confirmar Senha" required>
                            <button type="button" class="btn-toggle-eye" onclick="togglePassword('confirmPassword', this)" title="Mostrar/ocultar confirmação">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Botão Cadastrar -->
                    <button type="submit" class="btn-action">Cadastrar</button>
                </form>

                <!-- Rodapé -->
                <div class="footer-text">Já possui uma conta?</div>
                <div class="footer-links">
                    <a th:href="@{/login}" class="link-cadastre">Voltar ao Login</a>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
